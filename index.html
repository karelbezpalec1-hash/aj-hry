<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hry do angličtiny</title>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--glaze:#f5f7fb;--cobalt:#1c3a9b;--lemon:#f6cd1c;--ink:#141d47;--muted:#56608a;color-scheme:light}
body{margin:0;background:var(--glaze);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:32px 16px;display:flex;flex-direction:column;gap:16px}
h1{font-family:"Caprasimo",Georgia,serif;font-weight:400;color:var(--cobalt);margin:0;font-size:2rem}
a.game{display:block;background:#fff;border:2px solid var(--cobalt);border-radius:14px;box-shadow:4px 4px 0 var(--cobalt);padding:16px 18px;color:inherit;text-decoration:none}
a.game b{font-family:"Caprasimo",Georgia,serif;font-weight:400;color:var(--cobalt);font-size:1.3rem;display:block}
a.game span{color:var(--muted)}
a.game:focus-visible{outline:3px solid var(--lemon);outline-offset:3px}
</style>
</head>
<body>
<main class="wrap">
  <h1>English class games</h1>
  <a class="game" href="amalfi/"><b>Save the Last Lemon Tree</b><span>Escape game with 7 locks and a Hall of Fame · Amalfi lemons and mal secco · about 10–15 minutes</span></a>
</main>
</body>
</html>
